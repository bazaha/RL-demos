name: Gomoku15
options:
  # NOTE for App Store: `local.rl-demos.gomoku` is a placeholder. Register a
  # real bundle ID in the developer account and change it here BEFORE the
  # first upload -- the ID is locked to the App Store Connect record after
  # a build has been uploaded.
  bundleIdPrefix: local.rl-demos
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  # The whole UI is Simplified Chinese; this keeps CFBundleDevelopmentRegion
  # (what the system and the store report as the app's native language) true.
  developmentLanguage: zh-Hans
packages:
  # The engine (rules + Core ML + MCTS) lives in one place and is unit-tested
  # on its own. The app used to carry a second, divergent copy of it; that copy
  # is what silently fell out of step with the exporter.
  GomokuEngine:
    path: GomokuEngine
targets:
  Gomoku15:
    type: application
    platform: iOS
    sources:
      - Gomoku15
    dependencies:
      - package: GomokuEngine
    preBuildScripts:
      # Fails the build if the bundled .mlpackage is incomplete or if the app
      # and the exporter disagree about the input feature name -- the two ways
      # this target has already been broken.
      - name: Verify bundled Core ML model
        script: |
          S="$PROJECT_DIR/../scripts/refresh_ios_model.sh"
          if [ ! -x "$S" ]; then
            echo "error: $S is missing — build from inside the RL-demos checkout"
            exit 1
          fi
          "$S" --check
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.rl-demos.gomoku
        # App Store validation rejects a binary whose Info.plist has no
        # CFBundleShortVersionString / CFBundleVersion; with a generated
        # Info.plist they come from these two settings, which have no default.
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # iPad + multitasking (no UIRequiresFullScreen) requires all four
        # orientations or the upload fails validation (ITMS-90474). The board
        # already adapts to any aspect via GeometryReader.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # No crypto beyond the OS's own (the app never touches the network),
        # so answer App Store Connect's export-compliance question once here.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        INFOPLIST_KEY_CFBundleDisplayName: "五子棋 AZ"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        # Signing is ON. It used to be `CODE_SIGNING_ALLOWED: NO`, which made
        # simulator CLI builds convenient and device installs impossible --
        # and setting a Team in Xcode does not lift it, so the failure looked
        # like a mystery. Simulator builds still need no team (they ad-hoc sign
        # with identity "-"); device builds want a team, which stays out of the
        # repo so this is not tied to one developer account:
        #   xcodebuild ... GOMOKU_TEAM_ID=XXXXXXXXXX
        # or set GOMOKU_TEAM_ID once in Xcode's build settings.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(GOMOKU_TEAM_ID)
        COREML_CODEGEN_LANGUAGE: None   # we load the compiled model by URL
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  Gomoku15Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Gomoku15Tests
    dependencies:
      - target: Gomoku15
      - package: GomokuEngine
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Gomoku15.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Gomoku15"
        BUNDLE_LOADER: "$(TEST_HOST)"
        # the test bundle is signed too when running on a device
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(GOMOKU_TEAM_ID)
schemes:
  Gomoku15:
    build:
      targets:
        Gomoku15: all
        Gomoku15Tests: [test]
    test:
      targets:
        - Gomoku15Tests
