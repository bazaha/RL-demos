<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>node09 · 硬探针：检查点战术能力补测</title>
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb; --page: #f9f9f7; --surface-2: #f2f1ec;
    --text-1: #0b0b0b; --text-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #8a63d2;
    --good-text: #006300; --good: #0ca30c; --bad-text: #b3261e;
    --deemph: #c3c2b7;
    --board: #e8d9b5; --board-line: #a08b62;
    --stone-b: #17171a; --stone-w: #fbfbfa;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-1: #1a1a19; --page: #0d0d0d; --surface-2: #222220;
      --text-1: #ffffff; --text-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835;
      --border: rgba(255,255,255,0.10);
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #9a76dd;
      --good-text: #0ca30c; --bad-text: #e8695f;
      --deemph: #52514e;
      --board: #4a4130; --board-line: #7d6d4d;
      --stone-b: #0a0a0c; --stone-w: #f4f3ef;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #1a1a19; --page: #0d0d0d; --surface-2: #222220;
    --text-1: #ffffff; --text-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835;
    --border: rgba(255,255,255,0.10);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #9a76dd;
    --good-text: #0ca30c; --bad-text: #e8695f;
    --deemph: #52514e;
    --board: #4a4130; --board-line: #7d6d4d;
    --stone-b: #0a0a0c; --stone-w: #f4f3ef;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--text-1);
    font: 14px/1.55 -apple-system, "SF Pro Text", "PingFang SC", "Segoe UI",
      "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 20px 22px 48px; }
  header.rpt { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
  h1 { font-size: 20px; font-weight: 660; margin: 4px 0 2px; }
  h2 { font-size: 15.5px; font-weight: 650; margin: 30px 0 6px; }
  h2 .tag {
    font-size: 11.5px; color: var(--text-2); background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 999px; padding: 2px 9px;
    vertical-align: 2px; margin-left: 8px; font-weight: 500;
  }
  .sub, .lede { color: var(--text-2); font-size: 13px; max-width: 900px; }
  .lede b { color: var(--text-1); font-weight: 600; }
  .theme-btn {
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-2);
    border-radius: 8px; padding: 5px 10px; font-size: 12px; cursor: pointer; white-space: nowrap;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 2px; }
  .chip {
    font-size: 11.5px; color: var(--text-2); background: var(--surface-2);
    border: 1px solid var(--border); padding: 2px 9px; border-radius: 999px;
  }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
  figure.card {
    margin: 0; background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 14px 10px; min-width: 0;
  }
  figcaption { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  figcaption b { font-size: 13.5px; font-weight: 640; }
  figcaption .note { color: var(--muted); font-size: 11.5px; flex: 1; }
  .tbl-btn {
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-2);
    border-radius: 6px; font-size: 11px; padding: 2px 8px; cursor: pointer;
  }
  .chart-box { position: relative; margin-top: 6px; }
  .chart-box svg { display: block; width: 100%; height: auto; }
  .tip {
    position: absolute; pointer-events: none; display: none; z-index: 3;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 9px; font-size: 11.5px; color: var(--text-2);
    box-shadow: 0 4px 14px rgba(0,0,0,.14); white-space: nowrap;
  }
  .tip b { color: var(--text-1); font-weight: 620; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 4px 0 0; font-size: 11.5px; color: var(--text-2); }
  .legend .key { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 14px; border-top: 2.4px solid; display: inline-block; }
  .legend i.dash { border-top-style: dashed; }
  .legend i.box { width: 10px; height: 10px; border: 0; border-radius: 3px; }
  table.dt { border-collapse: collapse; font-size: 11.5px; margin-top: 8px; width: 100%; }
  table.dt th, table.dt td { border-bottom: 1px solid var(--border); padding: 3px 8px; text-align: right; color: var(--text-2); }
  table.dt th { color: var(--text-1); font-weight: 600; }
  table.dt td:first-child, table.dt th:first-child { text-align: left; }
  .note-box {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; font-size: 12.5px; color: var(--text-2); margin-top: 12px; max-width: 1100px;
  }
  .note-box b { color: var(--text-1); }
  .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .probe-card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 12px;
  }
  .probe-card h4 { margin: 0 0 2px; font-size: 12.5px; font-weight: 640; }
  .probe-card .desc { color: var(--muted); font-size: 11px; min-height: 42px; margin-bottom: 6px; }
  .probe-card canvas { width: 100%; height: auto; display: block; border-radius: 6px; }
  .mrow { display: grid; grid-template-columns: 46px repeat(9, 1fr); gap: 2px; margin-top: 3px;
          font: 10.5px ui-monospace, Menlo, monospace; color: var(--muted); align-items: center; }
  .mrow span { text-align: center; border-radius: 3px; padding: 1px 0; }
  .mrow .ok { color: var(--good-text); background: color-mix(in srgb, var(--good) 14%, transparent); }
  .mrow .bad { color: var(--bad-text); background: color-mix(in srgb, var(--bad-text) 12%, transparent); }
  footer { color: var(--muted); font-size: 11.5px; margin-top: 26px; border-top: 1px solid var(--border); padding-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="rpt">
    <div>
      <h1>硬探针：检查点战术能力补测</h1>
      <div class="sub" id="subLede"></div>
    </div>
    <button class="theme-btn" id="themeBtn" type="button">主题：跟随系统</button>
  </header>
  <div class="chips" id="chips"></div>
  <p class="lede" id="verdict" style="margin-top:12px"></p>

  <h2>正确率 <span class="tag">硬题 vs 训练期旧题</span></h2>
  <p class="lede">硬题把"显眼"与"正确"拆开：盘面上摆着诱人的线，但正解在别处。如果饱和只是旧题太浅的伪影，硬题就该拉出梯度。</p>
  <div class="grid2" style="margin-top:10px">
    <figure class="card" id="c-acc"></figure>
    <figure class="card" id="c-val"></figure>
  </div>

  <h2>HV2 的风格拐点 <span class="tag">同一道题，两代网络选不同的胜着</span></h2>
  <p class="lede" id="styleLede"></p>
  <figure class="card" id="c-style" style="margin-top:10px"></figure>

  <h2>八道硬题 <span class="tag">诱饵（饵）与正解（解）都画在盘上</span></h2>
  <p class="lede">good 集合由加固过的精确校验器计算（全部客观胜着 / 全部保命着），诱饵在构造期被逐一证明是坏棋。每盘下方是 9 个检查点的原始策略判定。</p>
  <div class="pgrid" id="probes" style="margin-top:10px"></div>
  <div class="note-box" id="lesson"></div>

  <footer id="foot"></footer>
</div>

<script>
"use strict";
const DATA = __DATA_JSON__;
const M = DATA.M, B = M.board, ITV = DATA.intervention_iter;
const CKS = M.checkpoints;
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const el = (t, a, parent) => {
  const e = document.createElementNS("http://www.w3.org/2000/svg", t);
  for (const k in a) e.setAttribute(k, a[k]);
  if (parent) parent.appendChild(e);
  return e;
};
const fmt = (v, d) => (+v).toLocaleString("en-US",
  { minimumFractionDigits: d ?? 0, maximumFractionDigits: d ?? 0 });

/* ---------- compact line chart: axes, legend, crosshair tooltip, table ---- */
function lineChart(id, o) {
  const fig = document.getElementById(id);
  const cap = document.createElement("figcaption");
  const b = document.createElement("b"); b.textContent = o.title; cap.appendChild(b);
  const nn = document.createElement("span"); nn.className = "note"; nn.textContent = o.note || "";
  cap.appendChild(nn);
  const tb = document.createElement("button"); tb.className = "tbl-btn"; tb.type = "button";
  tb.textContent = "表格"; cap.appendChild(tb);
  fig.appendChild(cap);
  const lg = document.createElement("div"); lg.className = "legend";
  for (const s of o.series) {
    const k = document.createElement("span"); k.className = "key";
    const i = document.createElement("i");
    i.style.borderTopColor = s.color;
    if (s.dash) i.className = "dash";
    if (s.dots) { i.className = "box"; i.style.background = s.color; i.style.opacity = .55; }
    k.appendChild(i); k.appendChild(document.createTextNode(s.name)); lg.appendChild(k);
  }
  fig.appendChild(lg);
  const box = document.createElement("div"); box.className = "chart-box"; fig.appendChild(box);
  const W = 560, H = 250, Mg = { t: 14, r: 14, b: 32, l: 46 };
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" }, null);
  box.appendChild(svg);
  const xs = o.series.flatMap(s => s.points.map(p => p[0]));
  const xmin = Math.min(...xs), xmax = Math.max(...xs);
  const ymin = o.yMin ?? Math.min(...o.series.flatMap(s => s.points.map(p => p[1])));
  const ymax = o.yMax ?? Math.max(...o.series.flatMap(s => s.points.map(p => p[1])));
  const X = x => Mg.l + (x - xmin) / (xmax - xmin || 1) * (W - Mg.l - Mg.r);
  const Y = y => H - Mg.b - (y - ymin) / (ymax - ymin || 1) * (H - Mg.t - Mg.b);
  for (let i = 0; i <= 4; i++) {                       // y grid + ticks
    const yv = ymin + (ymax - ymin) * i / 4;
    el("line", { x1: Mg.l, x2: W - Mg.r, y1: Y(yv), y2: Y(yv),
                 stroke: "var(--grid)", "stroke-width": 1 }, svg);
    const t = el("text", { x: Mg.l - 6, y: Y(yv) + 3.5, "text-anchor": "end",
                           "font-size": 10, fill: "var(--muted)" }, svg);
    t.textContent = o.yFmt ? o.yFmt(yv) : fmt(yv);
  }
  for (const xv of (o.xTicks || [])) {
    const t = el("text", { x: X(xv), y: H - Mg.b + 16, "text-anchor": "middle",
                           "font-size": 10, fill: "var(--muted)" }, svg);
    t.textContent = xv;
  }
  el("line", { x1: Mg.l, x2: W - Mg.r, y1: H - Mg.b, y2: H - Mg.b,
               stroke: "var(--axis)", "stroke-width": 1 }, svg);
  if (o.annotX != null) {                              // e.g. the intervention
    el("line", { x1: X(o.annotX), x2: X(o.annotX), y1: Mg.t, y2: H - Mg.b,
                 stroke: "var(--s2)", "stroke-width": 1.2, "stroke-dasharray": "4 3",
                 opacity: .8 }, svg);
    const t = el("text", { x: X(o.annotX) + 4, y: Mg.t + 9, "font-size": 10,
                           fill: "var(--s2)" }, svg);
    t.textContent = o.annotXLabel || "";
  }
  if (o.annotY != null) {
    el("line", { x1: Mg.l, x2: W - Mg.r, y1: Y(o.annotY), y2: Y(o.annotY),
                 stroke: "var(--axis)", "stroke-width": 1, "stroke-dasharray": "3 3" }, svg);
    const t = el("text", { x: W - Mg.r, y: Y(o.annotY) - 4, "text-anchor": "end",
                           "font-size": 10, fill: "var(--muted)" }, svg);
    t.textContent = o.annotYLabel || "";
  }
  for (const s of o.series) {
    if (s.dots) {
      for (const p of s.points)
        el("circle", { cx: X(p[0]), cy: Y(p[1]), r: 3.2, fill: s.color,
                       opacity: .5, stroke: "var(--surface-1)", "stroke-width": 1 }, svg);
      continue;
    }
    const d = "M" + s.points.map(p => `${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join("L");
    el("path", { d, fill: "none", stroke: s.color, "stroke-width": 2.2,
                 "stroke-dasharray": s.dash ? "6 4" : "none",
                 "stroke-linejoin": "round", "stroke-linecap": "round" }, svg);
    for (const p of s.points)
      el("circle", { cx: X(p[0]), cy: Y(p[1]), r: 3, fill: s.color,
                     stroke: "var(--surface-1)", "stroke-width": 1.4 }, svg);
  }
  /* crosshair tooltip: nearest x, all series */
  const tip = document.createElement("div"); tip.className = "tip"; box.appendChild(tip);
  const cross = el("line", { y1: Mg.t, y2: H - Mg.b, stroke: "var(--axis)",
                             "stroke-width": 1, visibility: "hidden" }, svg);
  const xvals = [...new Set(xs)].sort((a, b2) => a - b2);
  svg.addEventListener("mousemove", ev => {
    const r = svg.getBoundingClientRect();
    const mx = (ev.clientX - r.left) / r.width * W;
    let bx = xvals[0];
    for (const v of xvals) if (Math.abs(X(v) - mx) < Math.abs(X(bx) - mx)) bx = v;
    cross.setAttribute("x1", X(bx)); cross.setAttribute("x2", X(bx));
    cross.setAttribute("visibility", "visible");
    tip.textContent = "";
    const h = document.createElement("b"); h.textContent = `第 ${bx} 轮`;
    tip.appendChild(h);
    for (const s of o.series) {
      const p = s.points.find(q => q[0] === bx);
      if (!p) continue;
      const d = document.createElement("div");
      d.textContent = `${s.name}: ${o.yFmt ? o.yFmt(p[1]) : fmt(p[1], 2)}`;
      tip.appendChild(d);
    }
    tip.style.display = "block";
    tip.style.left = Math.min(ev.clientX - r.left + 14, r.width - 150) + "px";
    tip.style.top = (ev.clientY - r.top + 10) + "px";
  });
  svg.addEventListener("mouseleave", () => {
    tip.style.display = "none"; cross.setAttribute("visibility", "hidden");
  });
  /* table view */
  let tblEl = null;
  tb.addEventListener("click", () => {
    if (tblEl) { tblEl.remove(); tblEl = null; tb.textContent = "表格"; return; }
    tblEl = document.createElement("table"); tblEl.className = "dt";
    const tr = document.createElement("tr");
    ["轮次", ...o.series.map(s => s.name)].forEach(h => {
      const th = document.createElement("th"); th.textContent = h; tr.appendChild(th);
    });
    tblEl.appendChild(tr);
    for (const xv of xvals) {
      const r2 = document.createElement("tr");
      const td0 = document.createElement("td"); td0.textContent = xv; r2.appendChild(td0);
      for (const s of o.series) {
        const p = s.points.find(q => q[0] === xv);
        const td = document.createElement("td");
        td.textContent = p ? (o.yFmt ? o.yFmt(p[1]) : fmt(p[1], 3)) : "—";
        r2.appendChild(td);
      }
      tblEl.appendChild(r2);
    }
    fig.appendChild(tblEl); tb.textContent = "收起";
  });
}

/* ---------- header ---------- */
document.getElementById("subLede").textContent =
  `训练期的分级战术题第 5 轮就三档全满 —— 因为正解都落在盘面最显眼的线上。这里用 ${M.probe_meta.length} 道` +
  `"诱饵与正解分离"的硬题（构造期由精确校验器逐一证明），只读检查点重新测一遍 ${DATA.ckpt_tag} 的九个检查点。`;
{
  const chips = document.getElementById("chips");
  [`${DATA.date} · ${DATA.host}`, `${CKS.length} 个检查点（iter000–${String(CKS[CKS.length-1].iter).padStart(3,"0")}）`,
   `${M.probe_meta.length} 道硬题 × 原始策略 / +MCTS(${M.sims} 次模拟)`,
   `对照:训练期旧题 ${CKS[0].legacy_n} 道`].forEach(t => {
    const c = document.createElement("span"); c.className = "chip"; c.textContent = t;
    chips.appendChild(c);
  });
}

/* ---------- accuracy chart ---------- */
const NH = CKS[0].hard.length;
const accHardRaw = CKS.map(c => [c.iter, 100 * c.hard.filter(r => r.raw_ok).length / NH]);
const accHardM = CKS.map(c => [c.iter, 100 * c.hard.filter(r => r.mcts_ok).length / NH]);
const accLegRaw = CKS.map(c => [c.iter, 100 * c.legacy_raw / c.legacy_n]);
const accLegM = CKS.map(c => [c.iter, 100 * c.legacy_mcts / c.legacy_n]);
lineChart("c-acc", {
  title: "战术正确率",
  note: "硬题与旧题几乎同时在第 5 轮打满 —— 饱和是真实能力，不是旧题太浅",
  yMin: 0, yMax: 100, xTicks: CKS.map(c => c.iter),
  yFmt: v => fmt(v, 0) + "%",
  series: [
    { name: "硬题 · 原始策略", color: "var(--s1)", points: accHardRaw },
    { name: "硬题 · +MCTS", color: "var(--s1)", dash: true, points: accHardM },
    { name: "旧题 · 原始策略", color: "var(--s3)", points: accLegRaw },
    { name: "旧题 · +MCTS", color: "var(--s3)", dash: true, points: accLegM },
  ],
});

/* ---------- value-confidence chart ---------- */
const wonIds = M.probe_meta.filter(p => p.kind === "attack").map(p => p.id);
const vDots = [], vMean = [];
for (const c of CKS) {
  const vs = c.hard.filter(r => wonIds.includes(r.id)).map(r => r.value);
  for (const v of vs) vDots.push([c.iter, v]);
  vMean.push([c.iter, vs.reduce((a, b) => a + b, 0) / vs.length]);
}
lineChart("c-val", {
  title: "必胜局面上的价值头置信",
  note: "四道进攻题都是黑方必胜；选对棋第 5 轮就会，「知道赢定了」到第 30-35 轮才成熟",
  yMin: -1, yMax: 1, xTicks: CKS.map(c => c.iter),
  yFmt: v => (v > 0 ? "+" : "") + fmt(v, 1),
  annotX: ITV, annotXLabel: "温度干预",
  annotY: 0, annotYLabel: "0 = 不知胜负",
  series: [
    { name: "四题均值", color: "var(--s2)", points: vMean },
    { name: "单题", color: "var(--s2)", dots: true, points: vDots },
  ],
});

/* ---------- HV2 style strip ---------- */
{
  const meta = Object.fromEntries(M.probe_meta.map(p => [p.id, p]));
  const ids = ["hv2_poisoned_four", "hv2_poisoned_four_tr"];
  const LBL = { direct: "直取", poison: "占毒", other: "其他" };
  const CLR = { direct: "var(--s1)", poison: "var(--s4)", other: "var(--deemph)" };
  function cls(id, mv) {
    const good = meta[id].good;              // [direct crossing, poison square]
    if (mv === good[0]) return "direct";
    if (mv === good[1]) return "poison";
    return "other";
  }
  const fig = document.getElementById("c-style");
  const cap = document.createElement("figcaption");
  const b = document.createElement("b"); b.textContent = "HV2 · +MCTS 选择的胜着"; cap.appendChild(b);
  const nn = document.createElement("span"); nn.className = "note";
  nn.textContent = "两个胜着都客观正确；偏好在温度干预处整齐翻转（两个方向的棋盘一致）";
  cap.appendChild(nn); fig.appendChild(cap);
  const lg = document.createElement("div"); lg.className = "legend";
  [["direct", "直取:交叉点双威胁 (5,10)"], ["poison", "占毒:保先占毒点冲四 (12,12)"],
   ["other", "其他（未解出）"]].forEach(([k, t]) => {
    const s = document.createElement("span"); s.className = "key";
    const i = document.createElement("i"); i.className = "box"; i.style.background = CLR[k];
    s.appendChild(i); s.appendChild(document.createTextNode(t)); lg.appendChild(s);
  });
  fig.appendChild(lg);
  const box = document.createElement("div"); box.className = "chart-box"; fig.appendChild(box);
  const W = 1060, RH = 34, LPAD = 120, TOP = 26, H = TOP + 2 * (RH + 6) + 26;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}` }, null); box.appendChild(svg);
  const CW = (W - LPAD - 10) / CKS.length;
  CKS.forEach((c, i) => {
    const t = el("text", { x: LPAD + i * CW + CW / 2, y: TOP - 8, "text-anchor": "middle",
                           "font-size": 10.5, fill: "var(--muted)" }, svg);
    t.textContent = "第" + c.iter + "轮";
  });
  ids.forEach((id, row) => {
    const y = TOP + row * (RH + 6);
    const lab = el("text", { x: LPAD - 10, y: y + RH / 2 + 4, "text-anchor": "end",
                             "font-size": 11.5, fill: "var(--text-2)" }, svg);
    lab.textContent = row === 0 ? "原方向" : "转置方向";
    CKS.forEach((c, i) => {
      const r = c.hard.find(h => h.id === id);
      const k = cls(id, r.mcts_move);
      const g = el("rect", { x: LPAD + i * CW + 1, y, width: CW - 2, height: RH,
                             rx: 5, fill: CLR[k] }, svg);
      const tt = el("title", {}, g);
      tt.textContent = `第 ${c.iter} 轮 · ${id}\n落子 (${(r.mcts_move / B) | 0},${r.mcts_move % B}) · ${LBL[k]}`;
      const t = el("text", { x: LPAD + i * CW + CW / 2, y: y + RH / 2 + 4,
                             "text-anchor": "middle", "font-size": 11, "font-weight": 600,
                             fill: k === "other" ? "var(--text-2)" : "#fff" }, svg);
      t.textContent = LBL[k];
    });
  });
  const ix = LPAD + (CKS.findIndex(c => c.iter >= ITV)) * CW;   // divider before iter25
  el("line", { x1: ix, x2: ix, y1: TOP - 20, y2: TOP + 2 * (RH + 6) - 2,
               stroke: "var(--s2)", "stroke-width": 1.6, "stroke-dasharray": "5 3" }, svg);
  const it = el("text", { x: ix + 5, y: H - 6, "font-size": 10.5, fill: "var(--s2)" }, svg);
  it.textContent = `← 第 ${ITV} 轮温度干预（AZ_TEMP_MOVES 20→10 续跑）`;
  document.getElementById("styleLede").textContent =
    "HV2 里显眼的冲四被毒化（对方挡子会连出反四）。它有两个客观胜着：直接下交叉点形成双威胁，" +
    "或先占毒点本身 —— 这一手同时是保先的隔一格冲四，拆雷不失先。干预前的检查点全部直取，干预后的全部占毒。";
}

/* ---------- probe gallery (repaintable: canvases sample CSS vars) -------- */
function renderGallery() {
  const grid = document.getElementById("probes");
  grid.textContent = "";
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  const FAM = { HD1: "先防后攻", HD2: "识别跳三", HV1: "死四诱饵", HV2: "毒化冲四" };
  for (const p of M.probe_meta) {
    const card = document.createElement("div"); card.className = "probe-card";
    const h = document.createElement("h4");
    h.textContent = `${p.family} · ${FAM[p.family] || ""}${p.id.endsWith("_tr") ? "（转置）" : ""}`;
    card.appendChild(h);
    const d = document.createElement("div"); d.className = "desc"; d.textContent = p.desc;
    card.appendChild(d);
    const cv = document.createElement("canvas");
    const sz = 232 * DPR; cv.width = sz; cv.height = sz;
    card.appendChild(cv);
    const ctx = cv.getContext("2d");
    const pad = sz * 0.05, cell = (sz - 2 * pad) / (B - 1);
    ctx.fillStyle = css("--board");
    ctx.fillRect(0, 0, sz, sz);
    ctx.strokeStyle = css("--board-line"); ctx.lineWidth = DPR * 0.5;
    ctx.beginPath();
    for (let i = 0; i < B; i++) {
      ctx.moveTo(pad, pad + i * cell); ctx.lineTo(sz - pad, pad + i * cell);
      ctx.moveTo(pad + i * cell, pad); ctx.lineTo(pad + i * cell, sz - pad);
    }
    ctx.stroke();
    const mark = (a, color, glyph) => {
      const r = (a / B) | 0, c = a % B, x = pad + c * cell, y = pad + r * cell;
      ctx.fillStyle = color; ctx.globalAlpha = 0.22;
      ctx.fillRect(x - cell * .48, y - cell * .48, cell * .96, cell * .96);
      ctx.globalAlpha = 1;
      ctx.fillStyle = color;
      ctx.font = `bold ${cell * 0.72}px sans-serif`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(glyph, x, y + cell * 0.04);
    };
    for (let a = 0; a < B * B; a++) {
      const v = p.board_cells[a];
      if (!v) continue;
      const r = (a / B) | 0, c = a % B, x = pad + c * cell, y = pad + r * cell;
      ctx.fillStyle = v === 1 ? css("--stone-b") : css("--stone-w");
      ctx.beginPath(); ctx.arc(x, y, cell * 0.42, 0, 7); ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,.35)"; ctx.lineWidth = DPR * 0.5; ctx.stroke();
    }
    for (const a of p.good) mark(a, css("--good"), "解");
    for (const a of p.traps) mark(a, css("--bad-text"), "饵");
    /* per-checkpoint verdict rows */
    for (const [key, lab] of [["raw_ok", "原始"], ["mcts_ok", "+MCTS"]]) {
      const row = document.createElement("div"); row.className = "mrow";
      const l0 = document.createElement("span"); l0.textContent = lab;
      l0.style.textAlign = "left"; row.appendChild(l0);
      for (const c of CKS) {
        const r = c.hard.find(x => x.id === p.id);
        const s = document.createElement("span");
        s.className = r[key] ? "ok" : "bad";
        s.textContent = r[key] ? "✓" : "✗";
        s.title = `第 ${c.iter} 轮`;
        row.appendChild(s);
      }
      card.appendChild(row);
    }
    const ax = document.createElement("div"); ax.className = "mrow";
    const l0 = document.createElement("span"); l0.textContent = ""; ax.appendChild(l0);
    for (const c of CKS) {
      const s = document.createElement("span"); s.textContent = c.iter; ax.appendChild(s);
    }
    card.appendChild(ax);
    grid.appendChild(card);
  }
}
renderGallery();

/* ---------- theme ---------- */
(function themeInit() {
  const btn = document.getElementById("themeBtn");
  const LAB = { "": "主题：跟随系统", light: "主题：浅色", dark: "主题：深色" };
  let cur = "";
  btn.addEventListener("click", () => {
    cur = cur === "" ? "light" : cur === "light" ? "dark" : "";
    if (cur) document.documentElement.setAttribute("data-theme", cur);
    else document.documentElement.removeAttribute("data-theme");
    btn.textContent = LAB[cur];
    renderGallery();        // canvases sample CSS vars at draw time
  });
})();
